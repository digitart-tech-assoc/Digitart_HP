name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# 同じブランチに続けて push したときは、古い実行を止めて最新のコミットだけを検証する
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint・型チェック・ビルド
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: 依存パッケージのインストール
        run: npm ci

      - name: 整形チェック (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint -- --max-warnings 0

      - name: 型チェック
        run: npm run typecheck

      # 記事の frontmatter はビルド時に zod で検証されるため、記事の書き間違いもここで検出できる
      - name: ビルド
        run: npm run build

  secrets:
    name: 秘密情報の検出 (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # イメージとバージョンは .github/gitleaks/Dockerfile で指定する（Dependabot が更新する）
      - name: Gitleaks の準備
        run: docker build --quiet --tag gitleaks .github/gitleaks

      # 過去の履歴まで見ると既存のコミットで毎回落ちるため、今回追加されたコミットだけを検査する
      - name: Gitleaks の実行
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="origin/${BASE_REF}..HEAD"
          elif [ "$EVENT_NAME" = "push" ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            RANGE="${BEFORE_SHA}..HEAD"
          else
            # 手動実行時や、push 前のコミットが取れないとき（force push など）は最新コミットだけを見る
            RANGE="-1"
          fi
          echo "検査範囲: ${RANGE}"
          docker run --rm --volume "${PWD}:/repo" --workdir /repo gitleaks \
            detect --log-opts="${RANGE}" --redact --verbose --no-banner

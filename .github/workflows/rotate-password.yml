name: Rotate Admin Password

on:
  schedule:
    - cron: "0 0 * * 0" # 毎週日曜0時(UTC)に実行
  workflow_dispatch: # 手動実行も可能にする

# wrangler を .github/rotate/package-lock.json のとおりに入れるためのチェックアウトだけを許可する
# （どこかのステップが乗っ取られても、リポジトリを操作されないようにする）
permissions:
  contents: read

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      # wrangler とその依存パッケージを .github/rotate/package-lock.json で固定したバージョンで入れる
      # （npx でその場で取得すると、依存パッケージは毎回最新版が入り、Cloudflare の API トークンを渡す先が固定されないため）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 秘密情報を扱うワークフローなので、他のワークフローと共有するキャッシュは使わない
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # サイトの依存は入れず、wrangler だけの lockfile から入れる（入れるパッケージを最小にするため）
      # --ignore-scripts: 乗っ取られたパッケージが postinstall で node_modules/.bin/wrangler を書き換え、
      # 次のステップで API トークンと一緒に実行されるのを防ぐ（wrangler secret put の実行にスクリプトは要らない）
      # 秘密情報はこのステップに渡さない（API トークンは wrangler を実行するステップだけに渡す）
      - name: Install wrangler
        working-directory: .github/rotate
        run: npm ci --ignore-scripts

      - name: Generate Random Password
        id: gen
        run: |
          PWD=$(openssl rand -base64 9)
          echo "::add-mask::$PWD"
          echo "new_pwd=$PWD" >> $GITHUB_OUTPUT

      - name: Update Cloudflare Pages Env Var
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: "digitart-hp" # Cloudflare上のプロジェクト名
        # .github/rotate に入れた wrangler を使うため
        working-directory: .github/rotate
        run: |
          # 1. 新しいパスワード
          NEW_PWD="${{ steps.gen.outputs.new_pwd }}"

          # 2. Wrangler CLI を使って ADMIN_PASSWORD シークレットのみを安全に更新
          # .github/rotate に npm ci で入れた wrangler を使う（--no-install で、入っていないときにネットから取得しない）
          echo "$NEW_PWD" | npx --no-install wrangler pages secret put ADMIN_PASSWORD --project-name $PROJECT_NAME

          # 3. 新しいパスワードを反映させるための再デプロイ
          # --fail-with-body: HTTP 4xx・5xx のときに curl を失敗させる（付けないと終了コード 0 のまま Discord への通知に進んでしまう）
          # レスポンスにはプロジェクトの設定が含まれるため、ログには出さずにファイルへ保存し、必要な項目だけを取り出す
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/deployments"
          RESPONSE="$RUNNER_TEMP/deployment.json"
          if ! curl --fail-with-body -sS -X POST "$API" \
               -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -o "$RESPONSE"; then
            echo "::error::再デプロイのリクエストに失敗しました"
            jq -c '.errors' "$RESPONSE" || true
            exit 1
          fi
          if ! jq -e '.success == true' "$RESPONSE" > /dev/null; then
            echo "::error::再デプロイのリクエストが受け付けられませんでした"
            jq -c '.errors' "$RESPONSE" || true
            exit 1
          fi
          DEPLOYMENT_ID=$(jq -er '.result.id' "$RESPONSE")

          # 4. デプロイが終わるまで待つ（終わる前に通知すると、届いたパスワードでまだログインできない）
          # 10 秒おきに最大 15 分。失敗・キャンセル・時間切れのときはジョブを失敗させ、Discord には新しいパスワードを通知しない
          for _ in $(seq 1 90); do
            sleep 10
            # 一時的な通信の失敗では止めず、次の確認に回す
            if ! curl --fail-with-body -sS "$API/$DEPLOYMENT_ID" \
                 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -o "$RESPONSE"; then
              continue
            fi
            STAGE=$(jq -r '.result.latest_stage.name' "$RESPONSE")
            STATUS=$(jq -r '.result.latest_stage.status' "$RESPONSE")
            echo "デプロイの状態: $STAGE / $STATUS"
            if [ "$STATUS" = "failure" ] || [ "$STATUS" = "canceled" ]; then
              echo "::error::再デプロイに失敗しました（$STAGE / $STATUS）"
              exit 1
            fi
            if [ "$STAGE" = "deploy" ] && [ "$STATUS" = "success" ]; then
              exit 0
            fi
          done
          echo "::error::再デプロイが 15 分以内に終わりませんでした"
          exit 1

      - name: Notify Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl --fail -sS -H "Content-Type: application/json" \
               -d "{\"content\": \"[サークル公式ホームページ](https://www.digitart.jp/)のパスワードを更新しました。\n記事を執筆する際に必要となります。\n\nパスワード: \`${{ steps.gen.outputs.new_pwd }}\`\"}" \
               $WEBHOOK_URL

      # どこかで失敗したときは、新しいパスワードは通知せず、失敗したことだけを知らせる
      # （通知がないと、古いパスワードが使えたままなのか、新しいパスワードが届いていないだけなのかに誰も気づけない）
      - name: Notify Discord of failure
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail -sS -H "Content-Type: application/json" \
               -d "{\"content\": \"[サークル公式ホームページ](https://www.digitart.jp/)のパスワードの更新に失敗しました。新しいパスワードは通知されていません。\n今のパスワードでログインできない場合は、幹部に連絡してください。\n幹部はログを確認し、ワークフローを手動で実行し直してください: ${RUN_URL}\"}" \
               $WEBHOOK_URL

name: Rotate Admin Password

on:
  schedule:
    - cron: "0 0 * * 0" # 毎週日曜0時(UTC)に実行
  workflow_dispatch: # 手動実行も可能にする

# wrangler を .github/rotate/package-lock.json のとおりに入れるためのチェックアウトだけを許可する
# （どこかのステップが乗っ取られても、リポジトリを操作されないようにする）
permissions:
  contents: read

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      # wrangler とその依存パッケージを .github/rotate/package-lock.json で固定したバージョンで入れる
      # （npx でその場で取得すると、依存パッケージは毎回最新版が入り、Cloudflare の API トークンを渡す先が固定されないため）
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # 秘密情報を扱うワークフローなので、他のワークフローと共有するキャッシュは使わない
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # サイトの依存は入れず、wrangler だけの lockfile から入れる（入れるパッケージを最小にするため）
      # --ignore-scripts: 乗っ取られたパッケージが postinstall で node_modules/.bin/wrangler を書き換え、
      # 次のステップで API トークンと一緒に実行されるのを防ぐ（wrangler secret put の実行にスクリプトは要らない）
      # 秘密情報はこのステップに渡さない（API トークンは wrangler を実行するステップだけに渡す）
      - name: Install wrangler
        working-directory: .github/rotate
        run: npm ci --ignore-scripts

      - name: Generate Random Password
        id: gen
        run: |
          PWD=$(openssl rand -base64 9)
          echo "::add-mask::$PWD"
          echo "new_pwd=$PWD" >> $GITHUB_OUTPUT

      - name: Update Cloudflare Pages Env Var
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: "digitart-hp" # Cloudflare上のプロジェクト名
        # .github/rotate に入れた wrangler を使うため
        working-directory: .github/rotate
        run: |
          # 1. 新しいパスワード
          NEW_PWD="${{ steps.gen.outputs.new_pwd }}"

          # 2. Wrangler CLI を使って ADMIN_PASSWORD シークレットのみを安全に更新
          # .github/rotate に npm ci で入れた wrangler を使う（--no-install で、入っていないときにネットから取得しない）
          echo "$NEW_PWD" | npx --no-install wrangler pages secret put ADMIN_PASSWORD --project-name $PROJECT_NAME

          # 3. 新しいパスワードを反映させるための再デプロイ
          curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/deployments" \
               -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

      - name: Notify Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" \
               -d "{\"content\": \"[サークル公式ホームページ](https://www.digitart.jp/)のパスワードを更新しました。\n記事を執筆する際に必要となります。\n\nパスワード: \`${{ steps.gen.outputs.new_pwd }}\`\"}" \
               $WEBHOOK_URL

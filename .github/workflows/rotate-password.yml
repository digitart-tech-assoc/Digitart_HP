name: Rotate Admin Password

on:
  schedule:
    - cron: '0 0 * * 0' # 毎週日曜0時(UTC)に実行
  workflow_dispatch: # 手動実行も可能にする

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Random Password
        id: gen
        run: |
          PWD=$(openssl rand -base64 9)
          echo "::add-mask::$PWD"
          echo "new_pwd=$PWD" >> $GITHUB_OUTPUT

      - name: Update Cloudflare Pages Env Var
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: "digitart-hp" # Cloudflare上のプロジェクト名
        run: |
          # 1. 新しいパスワード
          NEW_PWD="${{ steps.gen.outputs.new_pwd }}"

          # 2. Wrangler CLI を使って ADMIN_PASSWORD シークレットのみを安全に更新
          echo "$NEW_PWD" | npx wrangler pages secret put ADMIN_PASSWORD --project-name $PROJECT_NAME

          # 3. 新しいパスワードを反映させるための再デプロイ
          curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/deployments" \
               -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

      - name: Notify Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" \
               -d "{\"content\": \"[サークル公式ホームページ](https://www.digitart.jp/)のパスワードを更新しました。\n記事を執筆する際に必要となります。\n\nパスワード: \`${{ steps.gen.outputs.new_pwd }}\`\"}" \
               $WEBHOOK_URL

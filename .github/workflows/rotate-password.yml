name: Rotate Admin Password

on:
  schedule:
    - cron: "0 0 * * 0" # 毎週日曜0時(UTC)に実行
  workflow_dispatch: # 手動実行も可能にする

# wrangler を .github/rotate/package-lock.json のとおりに入れるためのチェックアウトだけを許可する
# （どこかのステップが乗っ取られても、リポジトリを操作されないようにする）
permissions:
  contents: read

# 実行が重なると、後の実行が登録したパスワードで先の実行のビルドが動き、通知したパスワードと本番のパスワードが食い違う。
# そのため 1 つずつ順に実行する（実行中のものは打ち切らない。打ち切ると登録済みのパスワードが誰にも届かなくなる）
concurrency:
  group: rotate-password
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    # 再デプロイの完了を最大 45 分待つため、それより少し長くする（既定の 6 時間まで動き続けないように）
    timeout-minutes: 50
    env:
      PROJECT_NAME: "digitart-hp" # Cloudflare上のプロジェクト名
    steps:
      # wrangler とその依存パッケージを .github/rotate/package-lock.json で固定したバージョンで入れる
      # （npx でその場で取得すると、依存パッケージは毎回最新版が入り、Cloudflare の API トークンを渡す先が固定されないため）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 秘密情報を扱うワークフローなので、他のワークフローと共有するキャッシュは使わない
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # サイトの依存は入れず、wrangler だけの lockfile から入れる（入れるパッケージを最小にするため）
      # --ignore-scripts: 乗っ取られたパッケージが postinstall で node_modules/.bin/wrangler を書き換え、
      # 次のステップで API トークンと一緒に実行されるのを防ぐ（wrangler secret put の実行にスクリプトは要らない）
      # 秘密情報はこのステップに渡さない（API トークンは wrangler を実行するステップだけに渡す）
      - name: Install wrangler
        working-directory: .github/rotate
        run: npm ci --ignore-scripts

      - name: Generate Random Password
        id: gen
        run: |
          PWD=$(openssl rand -base64 9)
          echo "::add-mask::$PWD"
          echo "new_pwd=$PWD" >> $GITHUB_OUTPUT

      # Pages の secret は、次のデプロイから使われる。登録しただけでは本番のパスワードは変わらない
      - name: Update Cloudflare Pages Env Var
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # .github/rotate に入れた wrangler を使うため
        working-directory: .github/rotate
        run: |
          # 1. 新しいパスワード
          NEW_PWD="${{ steps.gen.outputs.new_pwd }}"

          # 2. Wrangler CLI を使って ADMIN_PASSWORD シークレットのみを安全に更新
          # .github/rotate に npm ci で入れた wrangler を使う（--no-install で、入っていないときにネットから取得しない）
          echo "$NEW_PWD" | npx --no-install wrangler pages secret put ADMIN_PASSWORD --project-name $PROJECT_NAME

      # 新しいパスワードを反映させるための再デプロイ（本番ブランチを改めてビルドする）。
      # curl は HTTP のエラーでも成功として終わるため、--fail-with-body と応答の success で失敗を検出する
      - name: Start Redeploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! RESPONSE=$(curl -sS --fail-with-body --max-time 60 -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/deployments" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"); then
            echo "::error::再デプロイを開始できませんでした"
            # 応答の全体には環境変数の一覧も含まれるため、エラーだけをログに出す
            echo "$RESPONSE" | jq -c '.errors' || true
            exit 1
          fi
          if ! echo "$RESPONSE" | jq -e '.success == true and (.result.is_skipped | not)' > /dev/null; then
            echo "::error::再デプロイが受け付けられませんでした"
            echo "$RESPONSE" | jq -c '{errors, skip_reason: .result.skip_reason}' || true
            exit 1
          fi
          echo "deployment_id=$(echo "$RESPONSE" | jq -r '.result.id')" >> "$GITHUB_OUTPUT"

      # 受け付けられても、ビルドに失敗すると本番は前のパスワードのままになるため、完了まで待つ。
      # 失敗と判断した後にデプロイが成功すると、通知していないパスワードに切り替わって誰もログインできなくなる。
      # そのため、他のビルドの順番待ち（Free プランは同時に 1 つ）と自分のビルド（Pages は 20 分で打ち切る）が
      # 終わるまで待てる 45 分を上限にし、状態の取得の失敗では諦めない。
      # 1 回の問い合わせが止まったままジョブの上限に達しないよう、curl には --max-time を付ける
      - name: Wait for Redeploy
        id: wait
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
        run: |
          DEADLINE=$((SECONDS + 45 * 60))
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            sleep 30
            if ! RESPONSE=$(curl -sS --fail-with-body --max-time 30 \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/deployments/${DEPLOYMENT_ID}" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"); then
              echo "::warning::デプロイの状態を取得できませんでした。問い合わせを続けます"
              continue
            fi
            if ! STAGE=$(echo "$RESPONSE" | jq -er 'select(.success == true) | .result.latest_stage | "\(.name)/\(.status)"'); then
              echo "::warning::デプロイの状態を読み取れませんでした。問い合わせを続けます"
              continue
            fi
            echo "$STAGE"
            case "$STAGE" in
              deploy/success) exit 0 ;;
              */failure | */canceled | */skipped)
                echo "::error::再デプロイが完了しませんでした（${STAGE}）"
                exit 1
                ;;
            esac
          done
          echo "::error::45 分待っても再デプロイが完了しませんでした"
          exit 1

      # ここで失敗を見逃すと、本番は誰も知らないパスワードになったまま成功扱いになるため、
      # Discord が HTTP のエラーを返したときも --fail-with-body で失敗にする
      - name: Notify Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -sS --fail-with-body --max-time 30 -H "Content-Type: application/json" \
               -d "{\"content\": \"[サークル公式ホームページ](https://www.digitart.jp/)のパスワードを更新しました。\n記事を執筆する際に必要となります。\n\nパスワード: \`${{ steps.gen.outputs.new_pwd }}\`\"}" \
               "$WEBHOOK_URL"

      # どのステップで失敗しても知らせる。新しいパスワードが登録済みなら、次のデプロイ（記事のマージなど）で
      # 誰も知らないパスワードに切り替わるので、早めに手動で再実行してもらう。パスワードは含めない。
      # 上限時間での打ち切りや手動のキャンセルは failure() に含まれないため、cancelled() でも知らせる
      - name: Notify Failure
        if: failure() || cancelled()
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # 再デプロイまで終わっていれば、本番はすでに新しいパスワードになっている（失敗したのは通知）
          DEPLOYED: ${{ steps.wait.outcome == 'success' }}
        run: |
          jq -n --arg url "$RUN_URL" --arg deployed "$DEPLOYED" '{content: ((
              if $deployed == "true" then
                "管理画面のパスワードを更新しましたが、新しいパスワードの通知に失敗しました。\n前のパスワードではもうログインできません。\n管理者はログを確認し、原因を直してからワークフローを手動で再実行してください（新しいパスワードが発行され、通知されます）。\n"
              else
                "管理画面のパスワードの更新に失敗しました。\n今は前のパスワードでログインできますが、次にサイトが公開し直されるとログインできなくなるおそれがあります。\n管理者はログを確認し、原因を直してからワークフローを手動で再実行してください。\n"
              end) + $url)}' \
            | curl -sS --fail-with-body --max-time 30 -H "Content-Type: application/json" -d @- "$WEBHOOK_URL"

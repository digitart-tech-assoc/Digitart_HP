version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # monthly は毎月 1 日に実行される
    schedule:
      interval: monthly
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    # PR が溢れないよう、マイナー・パッチ更新は 1 つの PR にまとめる
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    # monthly は毎月 1 日に実行される
    schedule:
      interval: monthly
      timezone: Asia/Tokyo

  # CI で使う Gitleaks のイメージ（.github/gitleaks/Dockerfile）
  - package-ecosystem: docker
    directory: /.github/gitleaks
    # monthly は毎月 1 日に実行される
    schedule:
      interval: monthly
      timezone: Asia/Tokyo
